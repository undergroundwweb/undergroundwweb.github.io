<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underground Rap – Nettspend & Osamason</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b12;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #eee;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ── grain texture ── */
        #grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            background-repeat: repeat;
            opacity: 0.15;
        }

        /* ── container ── */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ── hero ── */
        .hero {
            text-align: center;
            margin-bottom: 50px;
            padding: 20px 0;
        }
        .hero h1 {
            font-size: 4.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4dabf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(255, 200, 0, 0.2);
            animation: titlePulse 4s ease-in-out infinite alternate;
            letter-spacing: 4px;
        }
        @keyframes titlePulse {
            0% {
                filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.2));
            }
            100% {
                filter: drop-shadow(0 0 40px rgba(255, 200, 0, 0.6));
            }
        }
        .hero p {
            font-size: 1.4rem;
            color: #aaa;
            margin-top: 10px;
            letter-spacing: 2px;
        }
        .hero .click-hint {
            margin-top: 20px;
            font-size: 1rem;
            color: #ffd93d;
            animation: pulseHint 1.8s infinite;
        }
        @keyframes pulseHint {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ── gallery cards ── */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            transform: perspective(800px) rotateX(0) rotateY(0) scale(1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            position: relative;
            will-change: transform;
        }
        .card:hover {
            transform: perspective(800px) rotateX(2deg) rotateY(6deg) scale(1.04);
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 30px 70px rgba(255, 215, 0, 0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        .card:hover img {
            transform: scale(1.1);
        }
        .card-title {
            padding: 18px 16px 22px;
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.7));
            text-align: center;
        }
        .card-title span {
            transition: transform 0.3s;
            display: inline-block;
        }
        .card:hover .card-title span {
            transform: translateX(4px) scale(1.05);
            color: #ffd93d;
        }
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 215, 0, 0.10), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::after {
            opacity: 1;
        }

        /* ── modal ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0b12;
            z-index: 999;
            flex-direction: column;
            animation: modalIn 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow-y: auto;
            color: #eee;
        }
        .modal.active {
            display: flex;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.95);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        /* ── modal bar ── */
        .modal-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 20, 0.92);
            backdrop-filter: blur(12px);
            padding: 14px 30px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }
        .modal-back {
            font-size: 34px;
            font-weight: 300;
            color: #ffd93d;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 60px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
            line-height: 1;
        }
        .modal-back:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd93d;
            transform: scale(1.12) rotate(-6deg);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.25);
        }
        .modal-back:active {
            transform: scale(0.92);
        }
        .modal-title-tab {
            font-size: 20px;
            font-weight: 500;
            color: #ddd;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }
        .modal-counter {
            color: #888;
            font-size: 14px;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 18px;
            border-radius: 30px;
            border: 1px solid #333;
            min-width: 60px;
            text-align: center;
            transition: all 0.3s ease;
        }
        /* ── playing state for counter ── */
        .modal-counter.is-playing {
            color: #ffd93d;
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            animation: pulsePlaying 1.5s ease-in-out infinite;
        }
        @keyframes pulsePlaying {
            0% {
                opacity: 0.6;
                transform: scale(0.96);
            }
            50% {
                opacity: 1;
                transform: scale(1.04);
            }
            100% {
                opacity: 0.6;
                transform: scale(0.96);
            }
        }

        /* ── modal body ── */
        .modal-body {
            flex: 1;
            padding: 40px 40px 60px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            background: transparent;
        }

        /* ── artist view ── */
        .modal-body .artist-header {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }
        .modal-body .artist-img {
            flex: 0 0 180px;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            will-change: transform;
            transform-style: preserve-3d;
            transition: transform 0.08s ease-out;
            perspective: 800px;
            position: relative;
            z-index: 2;
        }
        .modal-body .artist-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
        .modal-body .artist-info {
            flex: 1;
            min-width: 200px;
            z-index: 2;
            position: relative;
        }
        .modal-body .artist-info h2 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd93d, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .modal-body .artist-info .origin {
            font-size: 1.1rem;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .modal-body .artist-info .genre {
            font-size: 1rem;
            color: #888;
        }
        .modal-body .history {
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }
        .modal-body .history h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffd93d;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding-bottom: 8px;
        }
        .modal-body .history ul {
            list-style: none;
            padding: 0;
        }
        .modal-body .history ul li {
            padding: 8px 0;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #ddd;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 12px;
        }
        .modal-body .history ul li::before {
            content: '→';
            color: #ffd93d;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .modal-body .albums {
            margin-top: 30px;
            position: relative;
            z-index: 2;
        }
        .modal-body .albums h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffd93d;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding-bottom: 8px;
        }

        /* ── ALBUM GRID – FOCUS EFFECT ── */
        .modal-body .albums .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .modal-body .albums .album-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease, background 0.3s, border-color 0.3s, box-shadow 0.3s;
            will-change: transform, opacity;
            transform-origin: center center;
        }

        /* When the grid is hovered, all items that are NOT hovered shrink & fade */
        .modal-body .albums .album-grid:hover .album-item:not(:hover) {
            transform: scale(0.88);
            opacity: 0.45;
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.03);
            box-shadow: none;
        }

        /* Hovered item grows and gets highlighted */
        .modal-body .albums .album-item:hover {
            transform: scale(1.08);
            opacity: 1;
            background: rgba(255, 215, 0, 0.12);
            border-color: #ffd93d;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.2);
        }

        /* keep cover image scaling inside the item */
        .modal-body .albums .album-item .album-cover {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            background: #222;
            margin-bottom: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .modal-body .albums .album-item .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }
        .modal-body .albums .album-item:hover .album-cover img {
            transform: scale(1.05);
        }
        .modal-body .albums .album-item .album-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #eee;
        }
        .modal-body .albums .album-item .album-year {
            font-size: 0.8rem;
            color: #888;
        }

        /* ── song list view ── */
        .song-list-view .back-to-artist {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 24px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            color: #ffd93d;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .song-list-view .back-to-artist:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.02);
        }
        .song-list-view h2 {
            font-size: 2.2rem;
            margin-bottom: 6px;
            color: #ffd93d;
        }
        .song-list-view .album-year {
            color: #888;
            margin-bottom: 20px;
        }
        .song-list-view .song-list {
            list-style: none;
            padding: 0;
        }
        .song-list-view .song-list li {
            padding: 12px 18px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border-left: 3px solid #ffd93d;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .song-list-view .song-list li:hover {
            background: rgba(255, 215, 0, 0.08);
            transform: translateX(6px);
        }
        .song-list-view .song-list li .play-icon {
            color: #ffd93d;
            font-size: 1.2rem;
        }
        .song-list-view .song-list li .song-name {
            flex: 1;
            font-size: 1.05rem;
        }
        .song-list-view .song-list li .song-length {
            color: #888;
            font-size: 0.85rem;
        }
        .song-list-view .no-songs {
            color: #888;
            font-style: italic;
        }

        /* ── player view ── */
        .player-view .back-to-songs {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            color: #ffd93d;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .player-view .back-to-songs:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        .player-view .player-track-info {
            margin-bottom: 20px;
        }
        .player-view .player-track-info .track-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #fff;
        }
        .player-view .player-track-info .track-album {
            color: #aaa;
            font-size: 0.95rem;
        }
        .player-view .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }
        .player-view .play-pause-btn {
            background: none;
            border: none;
            color: #ffd93d;
            font-size: 2.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1;
            padding: 0 8px;
            user-select: none;
            flex-shrink: 0;
        }
        .player-view .play-pause-btn:hover {
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .player-view .play-pause-btn:active {
            transform: scale(0.9);
        }
        .player-view .time-display {
            font-size: 0.9rem;
            color: #aaa;
            min-width: 80px;
            font-variant-numeric: tabular-nums;
        }
        .player-view .progress-container {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s;
        }
        .player-view .progress-container:hover {
            height: 8px;
        }
        .player-view .progress-bar {
            height: 100%;
            width: 0%;
            background: #ffd93d;
            border-radius: 10px;
            transition: width 0.05s linear;
            position: relative;
        }
        .player-view .progress-bar::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 14px;
            height: 14px;
            background: #ffd93d;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .player-view .progress-container:hover .progress-bar::after {
            opacity: 1;
        }

        /* ── scrollbar ── */
        .modal::-webkit-scrollbar {
            width: 8px;
        }
        .modal::-webkit-scrollbar-track {
            background: #0b0b12;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #ffd93d;
            border-radius: 10px;
        }
        .modal::-webkit-scrollbar-thumb:hover {
            background: #ffc107;
        }

        /* ── responsive ── */
        @media (max-width: 700px) {
            .hero h1 {
                font-size: 2.8rem;
            }
            .modal-body {
                padding: 20px;
            }
            .modal-body .artist-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .modal-body .artist-img {
                flex: 0 0 140px;
                height: 160px;
            }
            .modal-body .artist-info h2 {
                font-size: 2rem;
            }
            .modal-back {
                width: 50px;
                height: 50px;
                font-size: 28px;
            }
            .modal-title-tab {
                font-size: 16px;
                padding: 4px 16px;
            }
            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
            .card img {
                height: 200px;
            }
            .song-list-view h2 {
                font-size: 1.8rem;
            }
            .player-view .player-track-info .track-name {
                font-size: 1.3rem;
            }
            .player-view .play-pause-btn {
                font-size: 2rem;
            }
        }
        @media (max-width: 500px) {
            .modal-body .artist-img {
                flex: 0 0 120px;
                height: 140px;
            }
            .modal-body .artist-info h2 {
                font-size: 1.6rem;
            }
            .gallery {
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
            .card-title {
                font-size: 1rem;
                padding: 12px;
            }
            .card img {
                height: 160px;
            }
            .song-list-view .song-list li {
                padding: 10px 14px;
            }
            .player-view .play-pause-btn {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- grain overlay -->
    <div id="grain"></div>

    <!-- main gallery -->
    <div class="container">
        <div class="hero">
            <h1>UNDERGROUND NEW WAVE</h1>
            <p>Click any artist to explore their story &amp; discography</p>
            <div class="click-hint">⬇ Tap a card ⬇</div>
        </div>
        <div class="gallery" id="artistGrid"></div>
    </div>

    <!-- modal -->
    <div class="modal" id="modal">
        <div class="modal-bar">
            <button class="modal-back" id="modalBack" aria-label="Back">←</button>
            <div class="modal-title-tab" id="modalTabTitle">Artist</div>
            <div class="modal-counter" id="modalCounter"></div>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>

    <!-- hidden audio -->
    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ARTIST DATA – 17 new tracks added to "early life crisis"

        const artists = [{

            ],
            albums: [{
                name: 'early life crisis',
                year: 2026,
                cover: 'https://i.pinimg.com/736x/c3/8e/4e/c38e4e3f55fc886063e9002a9f70a4e4.jpg',
                songs: [
                    // ── original 4 tracks ──
                    { name: 'you ready?', url: 'https://files.catbox.moe/jh2dy0.mp3' },
                    { name: 'ce', url: 'ce.mp3' },
                    { name: 'crisis', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
                    { name: 'early', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
                    // ── 17 NEW TRACKS ──
                    // 👇 Replace the URL with your own MP3 link or file name
                    { name: 'Track 5', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-30.mp3' },
                    { name: 'Track 6', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-31.mp3' },

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BUILD CARDS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const grid = document.getElementById('artistGrid');
        artists.forEach(a => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = a.id;
            const img = document.createElement('img');
            img.src = a.image;
            img.alt = a.name;
            img.loading = 'lazy';
            const title = document.createElement('div');
            title.className = 'card-title';
            title.innerHTML = `<span>${a.name}</span>`;
            card.appendChild(img);
            card.appendChild(title);
            grid.appendChild(card);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MOUSE GLOW & TILT ON MAIN CARDS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--mx', x + '%');
                card.style.setProperty('--my', y + '%');
                const rotX = (y - 50) / 8;
                const rotY = (x - 50) / 8;
                card.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.04)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) scale(1)';
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GLOBAL STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const modal = document.getElementById('modal');
        const modalBack = document.getElementById('modalBack');
        const modalTabTitle = document.getElementById('modalTabTitle');
        const modalCounter = document.getElementById('modalCounter');
        const modalBody = document.getElementById('modalBody');
        const audio = document.getElementById('audioPlayer');

        let currentArtistId = null;
        let currentAlbumIndex = null;
        let isPlaying = false;
        let followListener = null;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER FUNCTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderArtistView(artistId) {
            const artist = artists.find(a => a.id === artistId);
            if (!artist) return;
            currentArtistId = artistId;
            modalTabTitle.textContent = artist.name;
            modalCounter.textContent = artist.genre.split(',')[0].trim();
            modalCounter.classList.remove('is-playing');

            let historyHTML = artist.history.map(item => `<li>${item}</li>`).join('');
            let albumsHTML = '';
            if (artist.albums && artist.albums.length) {
                albumsHTML = artist.albums.map((alb, index) => `
                        <div class="album-item" data-artist="${artist.id}" data-album="${index}">
                            <div class="album-cover"><img src="${alb.cover}" alt="${alb.name}" loading="lazy"></div>
                            <div class="album-name">${alb.name}</div>
                            <div class="album-year">${alb.year}</div>
                        </div>
                    `).join('');
            } else {
                albumsHTML = '<p style="color:#888;">No albums listed</p>';
            }

            modalBody.innerHTML = `
                    <div class="artist-header" id="artistHeader">
                        <div class="artist-img" id="artistImg">
                            <img src="${artist.image}" alt="${artist.name}">
                        </div>
                        <div class="artist-info">
                            <h2>${artist.name}</h2>
                            <div class="origin">${artist.origin}</div>
                            <div class="genre">${artist.genre}</div>
                        </div>
                    </div>
                    <div class="history">
                        <h3>History</h3>
                        <ul>${historyHTML}</ul>
                    </div>
                    <div class="albums">
                        <h3>Albums</h3>
                        <div class="album-grid">${albumsHTML}</div>
                    </div>
                `;

            // ── MOUSE FOLLOW: rotate artist image to look at cursor ──
            const artistImg = document.getElementById('artistImg');
            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }
            if (artistImg) {
                followListener = (e) => {
                    const modalRect = modal.getBoundingClientRect();
                    let x = (e.clientX - modalRect.left) / modalRect.width;
                    let y = (e.clientY - modalRect.top) / modalRect.height;
                    x = Math.max(0, Math.min(1, x));
                    y = Math.max(0, Math.min(1, y));
                    const rotY = (x - 0.5) * 40;
                    const rotX = (0.5 - y) * 40;
                    artistImg.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
                };
                document.addEventListener('mousemove', followListener);
            }

            // ── album click ──
            document.querySelectorAll('.album-item').forEach(el => {
                el.addEventListener('click', function() {
                    const aId = this.dataset.artist;
                    const albIdx = parseInt(this.dataset.album);
                    showAlbumSongs(aId, albIdx);
                });
            });
        }

        // ─────────────────────────────────────────────

        function showAlbumSongs(artistId, albumIndex) {
            const artist = artists.find(a => a.id === artistId);
            if (!artist) return;
            const album = artist.albums[albumIndex];
            if (!album) return;
            currentArtistId = artistId;
            currentAlbumIndex = albumIndex;

            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }

            modalTabTitle.textContent = `${artist.name} – ${album.name}`;
            modalCounter.textContent = (album.songs ? album.songs.length : 0) + ' tracks';
            modalCounter.classList.remove('is-playing');

            let songsHTML = '';
            if (album.songs && album.songs.length) {
                songsHTML = `<ul class="song-list">`;
                album.songs.forEach((song, idx) => {
                    const hasUrl = song.url && song.url.trim() !== '';
                    const playIcon = hasUrl ? '▶' : '⏸';
                    songsHTML += `
                            <li data-artist="${artistId}" data-album="${albumIndex}" data-song="${idx}">
                                <span class="play-icon">${playIcon}</span>
                                <span class="song-name">${song.name}</span>
                                <span class="song-length">${hasUrl ? 'audio' : 'no audio'}</span>
                            </li>
                        `;
                });
                songsHTML += `</ul>`;
            } else {
                songsHTML = `<p class="no-songs">No songs listed for this album.</p>`;
            }

            modalBody.innerHTML = `
                    <div class="song-list-view">
                        <div class="back-to-artist" id="backToArtist">← Back to ${artist.name}</div>
                        <h2>${album.name}</h2>
                        <div class="album-year">${album.year}</div>
                        ${songsHTML}
                    </div>
                `;

            document.getElementById('backToArtist').addEventListener('click', () => {
                renderArtistView(artistId);
            });

            document.querySelectorAll('.song-list li').forEach(item => {
                item.addEventListener('click', function() {
                    const aId = this.dataset.artist;
                    const albIdx = parseInt(this.dataset.album);
                    const songIdx = parseInt(this.dataset.song);
                    showPlayer(aId, albIdx, songIdx);
                });
            });
        }

        // ─────────────────────────────────────────────

        function showPlayer(artistId, albumIndex, songIndex) {
            const artist = artists.find(a => a.id === artistId);
            if (!artist) return;
            const album = artist.albums[albumIndex];
            if (!album) return;
            const song = album.songs[songIndex];
            if (!song || !song.url || song.url.trim() === '') {
                alert('No audio URL for this track.');
                return;
            }

            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }

            modalTabTitle.textContent = `${artist.name} – ${song.name}`;
            modalCounter.textContent = 'playing';
            modalCounter.classList.add('is-playing');

            modalBody.innerHTML = `
                    <div class="player-view">
                        <div class="back-to-songs" id="backToSongs">← Back to songs</div>
                        <div class="player-track-info">
                            <div class="track-name">${song.name}</div>
                            <div class="track-album">${album.name} • ${artist.name}</div>
                        </div>
                        <div class="player-controls">
                            <div class="play-pause-btn" id="playPauseBtn">⛥</div>
                            <span class="time-display" id="currentTimeDisplay">0:00</span>
                            <div class="progress-container" id="progressContainer">
                                <div class="progress-bar" id="progressBar"></div>
                            </div>
                            <span class="time-display" id="durationDisplay">0:00</span>
                        </div>
                    </div>
                `;

            audio.src = song.url;

            audio.play().then(() => {
                isPlaying = true;
            }).catch(err => {
                console.warn('Playback failed:', err);
                isPlaying = false;
            });

            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');

            function updateProgress() {
                if (!audio.duration || isNaN(audio.duration)) {
                    durationDisplay.textContent = '0:00';
                } else {
                    durationDisplay.textContent = formatTime(audio.duration);
                }
                if (audio.currentTime) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressBar.style.width = percent + '%';
                    currentTimeDisplay.textContent = formatTime(audio.currentTime);
                }
            }

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateProgress);

            playPauseBtn.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play().catch(e => console.warn(e));
                    isPlaying = true;
                }
            });

            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                const percent = clickX / width;
                if (audio.duration) {
                    audio.currentTime = percent * audio.duration;
                }
            });

            document.getElementById('backToSongs').addEventListener('click', () => {
                audio.pause();
                audio.removeEventListener('timeupdate', updateProgress);
                audio.removeEventListener('loadedmetadata', updateProgress);
                isPlaying = false;
                showAlbumSongs(artistId, albumIndex);
            });

            audio.addEventListener('ended', () => {
                isPlaying = false;
                progressBar.style.width = '0%';
                currentTimeDisplay.textContent = '0:00';
            });
        }

        // ─────────────────────────────────────────────

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  OPEN / CLOSE MODAL
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function openModal(artistId) {
            renderArtistView(artistId);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            audio.pause();
            audio.src = '';
            isPlaying = false;
            modalCounter.classList.remove('is-playing');
            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }
        }

        // ── card clicks ──
        cards.forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.id;
                if (id) openModal(id);
            });
        });

        // ── modal controls ──
        modalBack.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        console.log('🔥 Added 17 more tracks – now 21 songs in "early life crisis"');
        console.log('👉 Replace the URL in each song with your own MP3 link or file name.');
    </script>
