<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underground Rap – GOATS</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #eee;
            overflow-x: hidden;
            min-height: 100vh;
            background: #05050f;
            cursor: default;
        }

        /* ── video background ── */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        /* ── 3D Parallax Nebula ── */
        #nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 30% 40%, rgba(100,0,200,0.15), transparent 60%),
                        radial-gradient(circle at 80% 70%, rgba(0,200,255,0.1), transparent 50%);
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* ── glow orb ── */
        #glow-orb {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 70% 30%, rgba(0, 200, 255, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* ── grain texture ── */
        #grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
            background-repeat: repeat;
            opacity: 0.15;
        }

        /* ── CRT scanline overlay ── */
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 2px, transparent 2px, transparent 4px);
            opacity: 0.3;
        }

        /* ── neon cursor ring (gray tint) ── */
        #cursor-ring {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(200,200,200,0.6);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(200,200,200,0.3), inset 0 0 20px rgba(200,200,200,0.1);
            opacity: 0;
            will-change: transform, width, height;
        }
        #cursor-ring.active {
            opacity: 1;
            border-color: #ccc;
            box-shadow: 0 0 40px rgba(200,200,200,0.5), inset 0 0 40px rgba(200,200,200,0.2);
        }
        #cursor-ring.hover {
            width: 80px;
            height: 80px;
            border-color: #aaa;
            box-shadow: 0 0 60px rgba(200,200,200,0.6), inset 0 0 60px rgba(200,200,200,0.3);
        }

        /* ── floating particles ── */
        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200,200,200,0.6), rgba(100,100,255,0.2));
            will-change: transform, opacity;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { opacity: 0.9; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
        }

        /* ── container ── */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 60px;
            perspective: 1200px;
        }

        /* ── hero ── */
        .hero {
            text-align: center;
            margin-bottom: 50px;
            padding: 20px 0;
            perspective: 800px;
        }
        .hero h1 {
            font-size: 5.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4dabf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 60px rgba(255, 200, 0, 0.2);
            animation: titlePulse 4s ease-in-out infinite alternate, glitchHero 6s steps(1) infinite;
            letter-spacing: 6px;
            transform: rotateX(0deg);
            transition: transform 0.2s;
        }
        .hero h1:hover {
            transform: rotateX(10deg) scale(1.02);
        }
        @keyframes glitchHero {
            0%, 100% { transform: skew(0deg); }
            2% { transform: skew(5deg) translateX(4px); text-shadow: 4px 0 red, -4px 0 blue; }
            4% { transform: skew(-5deg) translateX(-4px); text-shadow: -4px 0 red, 4px 0 blue; }
            6% { transform: skew(0deg); text-shadow: 0 0 0; }
            10% { transform: skew(0deg); }
            12% { transform: skew(-3deg) translateX(2px); text-shadow: 2px 0 cyan, -2px 0 magenta; }
            14% { transform: skew(3deg) translateX(-2px); text-shadow: -2px 0 cyan, 2px 0 magenta; }
            16% { transform: skew(0deg); text-shadow: 0 0 0; }
            20% { transform: skew(0deg); }
        }
        @keyframes titlePulse {
            0% { filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.2)); }
            100% { filter: drop-shadow(0 0 60px rgba(255, 200, 0, 0.6)); }
        }
        .hero p {
            font-size: 1.4rem;
            color: #aaa;
            margin-top: 10px;
            letter-spacing: 2px;
            animation: floatText 3s ease-in-out infinite;
        }
        .hero .click-hint {
            margin-top: 20px;
            font-size: 1rem;
            color: #ffd93d;
            animation: pulseHint 1.8s infinite;
        }
        @keyframes pulseHint {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ── gallery cards ── */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            transform: perspective(800px) rotateX(0) rotateY(0) scale(1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            position: relative;
            will-change: transform;
        }
        .card:hover {
            transform: perspective(800px) rotateX(3deg) rotateY(8deg) scale(1.04);
            border-color: rgba(200,200,200,0.6);
            box-shadow: 0 30px 80px rgba(200,200,200,0.25);
            background: rgba(255, 255, 255, 0.08);
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(200,200,200,0.1), transparent 50%, rgba(100,100,255,0.1));
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .card:hover::before {
            opacity: 1;
        }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        .card:hover img {
            transform: scale(1.1);
        }
        .card-title {
            padding: 18px 16px 22px;
            font-weight: 700;
            font-size: 1.2rem;
            background: transparent;
            text-align: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            z-index: 2;
        }

        /* ── ★ GRAY GLOWING NAMES ON CARDS ── */
        .card-title span {
            display: inline-block;
            position: relative;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ddd, #aaa, #bbb, #888);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 6s ease-in-out infinite, glitchUltra 2.5s steps(1) infinite;
            /* gray glow */
            text-shadow: 0 0 30px rgba(200, 200, 200, 0.5), 0 0 60px rgba(200, 200, 200, 0.3), 0 0 100px rgba(180, 180, 180, 0.15);
            transition: transform 0.3s, filter 0.3s;
            filter: drop-shadow(0 0 20px rgba(200, 200, 200, 0.4));
        }
        .card-title span::before,
        .card-title span::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .card-title span::before {
            color: red;
            transform: translateX(2px);
            text-shadow: 2px 0 red;
        }
        .card-title span::after {
            color: blue;
            transform: translateX(-2px);
            text-shadow: -2px 0 blue;
        }
        .card:hover .card-title span::before,
        .card:hover .card-title span::after {
            opacity: 0.7;
            animation: glitchShift 0.2s infinite alternate;
        }
        @keyframes glitchShift {
            0% { transform: translateX(3px) skewX(2deg); }
            100% { transform: translateX(-3px) skewX(-2deg); }
        }

        .card:hover .card-title span {
            transform: scale(1.12);
            /* stronger gray glow on hover */
            text-shadow: 0 0 40px rgba(200, 200, 200, 0.9), 0 0 80px rgba(200, 200, 200, 0.6), 0 0 120px rgba(180, 180, 180, 0.3);
            filter: drop-shadow(0 0 30px rgba(200, 200, 200, 0.8)) drop-shadow(0 0 60px rgba(200, 200, 200, 0.5));
            animation-duration: 3s, 1.5s;
        }

        @keyframes glitchUltra {
            0%, 100% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            1% { transform: translate(-12px, 3px) skew(-8deg); clip-path: inset(0 0 45% 0); text-shadow: 4px 0 0 rgba(255,0,0,0.5), -4px 0 0 rgba(0,0,255,0.5); }
            2% { transform: translate(15px, -5px) skew(10deg); clip-path: inset(55% 0 0 0); text-shadow: -6px 0 0 rgba(255,0,0,0.6), 6px 0 0 rgba(0,0,255,0.6); }
            3% { transform: translate(-4px, 2px) skew(-2deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            5% { transform: translate(8px, -2px) skew(5deg); clip-path: inset(20% 0 60% 0); text-shadow: 3px 0 0 rgba(255,0,0,0.4), -3px 0 0 rgba(0,0,255,0.4); }
            6% { transform: translate(-10px, 4px) skew(-6deg); clip-path: inset(70% 0 10% 0); text-shadow: -5px 0 0 rgba(255,0,0,0.7), 5px 0 0 rgba(0,0,255,0.7); }
            7% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            9% { transform: translate(5px, -1px) skew(3deg); clip-path: inset(0 0 30% 0); text-shadow: 2px 0 0 rgba(255,0,0,0.3), -2px 0 0 rgba(0,0,255,0.3); }
            10% { transform: translate(-7px, 3px) skew(-4deg); clip-path: inset(40% 0 0 0); text-shadow: -4px 0 0 rgba(255,0,0,0.5), 4px 0 0 rgba(0,0,255,0.5); }
            11% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            13% { transform: translate(-14px, 2px) skew(-7deg); clip-path: inset(0 0 50% 0); text-shadow: 5px 0 0 rgba(255,0,0,0.6), -5px 0 0 rgba(0,0,255,0.6); }
            14% { transform: translate(12px, -4px) skew(8deg); clip-path: inset(50% 0 0 0); text-shadow: -7px 0 0 rgba(255,0,0,0.7), 7px 0 0 rgba(0,0,255,0.7); }
            15% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            18% { transform: translate(6px, -3px) skew(4deg); clip-path: inset(0 0 20% 0); text-shadow: 3px 0 0 rgba(255,0,0,0.4), -3px 0 0 rgba(0,0,255,0.4); }
            19% { transform: translate(-9px, 2px) skew(-5deg); clip-path: inset(80% 0 0 0); text-shadow: -6px 0 0 rgba(255,0,0,0.6), 6px 0 0 rgba(0,0,255,0.6); }
            20% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            23% { transform: translate(-11px, 1px) skew(-3deg); clip-path: inset(0 0 40% 0); text-shadow: 4px 0 0 rgba(255,0,0,0.5), -4px 0 0 rgba(0,0,255,0.5); }
            24% { transform: translate(13px, -2px) skew(6deg); clip-path: inset(60% 0 0 0); text-shadow: -5px 0 0 rgba(255,0,0,0.6), 5px 0 0 rgba(0,0,255,0.6); }
            25% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            28% { transform: translate(4px, -1px) skew(2deg); clip-path: inset(0 0 10% 0); text-shadow: 2px 0 0 rgba(255,0,0,0.3), -2px 0 0 rgba(0,0,255,0.3); }
            29% { transform: translate(-8px, 3px) skew(-4deg); clip-path: inset(30% 0 0 0); text-shadow: -4px 0 0 rgba(255,0,0,0.5), 4px 0 0 rgba(0,0,255,0.5); }
            30% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            35% { transform: translate(-6px, 2px) skew(-2deg); clip-path: inset(0 0 70% 0); text-shadow: 3px 0 0 rgba(255,0,0,0.4), -3px 0 0 rgba(0,0,255,0.4); }
            36% { transform: translate(9px, -3px) skew(5deg); clip-path: inset(90% 0 0 0); text-shadow: -5px 0 0 rgba(255,0,0,0.6), 5px 0 0 rgba(0,0,255,0.6); }
            37% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            40% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            45% { transform: translate(-10px, 1px) skew(-5deg); clip-path: inset(0 0 55% 0); text-shadow: 4px 0 0 rgba(255,0,0,0.5), -4px 0 0 rgba(0,0,255,0.5); }
            46% { transform: translate(14px, -4px) skew(7deg); clip-path: inset(45% 0 0 0); text-shadow: -6px 0 0 rgba(255,0,0,0.7), 6px 0 0 rgba(0,0,255,0.7); }
            47% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            50% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            55% { transform: translate(7px, -2px) skew(3deg); clip-path: inset(0 0 25% 0); text-shadow: 2px 0 0 rgba(255,0,0,0.3), -2px 0 0 rgba(0,0,255,0.3); }
            56% { transform: translate(-12px, 3px) skew(-6deg); clip-path: inset(75% 0 0 0); text-shadow: -5px 0 0 rgba(255,0,0,0.6), 5px 0 0 rgba(0,0,255,0.6); }
            57% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            60% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            65% { transform: translate(-5px, 1px) skew(-2deg); clip-path: inset(0 0 15% 0); text-shadow: 3px 0 0 rgba(255,0,0,0.4), -3px 0 0 rgba(0,0,255,0.4); }
            66% { transform: translate(11px, -1px) skew(4deg); clip-path: inset(85% 0 0 0); text-shadow: -4px 0 0 rgba(255,0,0,0.5), 4px 0 0 rgba(0,0,255,0.5); }
            67% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            70% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            75% { transform: translate(10px, -3px) skew(5deg); clip-path: inset(0 0 60% 0); text-shadow: 4px 0 0 rgba(255,0,0,0.5), -4px 0 0 rgba(0,0,255,0.5); }
            76% { transform: translate(-13px, 2px) skew(-7deg); clip-path: inset(40% 0 0 0); text-shadow: -6px 0 0 rgba(255,0,0,0.7), 6px 0 0 rgba(0,0,255,0.7); }
            77% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            80% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            85% { transform: translate(-8px, 2px) skew(-4deg); clip-path: inset(0 0 35% 0); text-shadow: 3px 0 0 rgba(255,0,0,0.4), -3px 0 0 rgba(0,0,255,0.4); }
            86% { transform: translate(9px, -2px) skew(4deg); clip-path: inset(65% 0 0 0); text-shadow: -5px 0 0 rgba(255,0,0,0.6), 5px 0 0 rgba(0,0,255,0.6); }
            87% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            90% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            95% { transform: translate(3px, -1px) skew(1deg); clip-path: inset(0 0 0 0); text-shadow: 1px 0 0 rgba(255,0,0,0.2), -1px 0 0 rgba(0,0,255,0.2); }
            96% { transform: translate(-3px, 1px) skew(-1deg); clip-path: inset(0 0 0 0); text-shadow: -1px 0 0 rgba(255,0,0,0.2), 1px 0 0 rgba(0,0,255,0.2); }
            97% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
            100% { transform: translate(0,0) skew(0deg); clip-path: inset(0 0 0 0); text-shadow: 0 0 0 rgba(255,0,0,0), 0 0 0 rgba(0,0,255,0); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(200, 200, 200, 0.10), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::after {
            opacity: 1;
        }

        /* ── modal ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0b12;
            z-index: 999;
            flex-direction: column;
            animation: modalIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            overflow-y: auto;
            color: #eee;
            perspective: 1200px;
        }
        .modal.active {
            display: flex;
        }
        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.95) rotateX(5deg); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg); filter: blur(0); }
        }

        /* ── modal spotlight sweep (gray tint) ── */
        .modal::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(200,200,200,0.06), transparent 60%);
            animation: spotlightSweep 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes spotlightSweep {
            0% { transform: translate(-10%, 0) scale(1); }
            100% { transform: translate(10%, 0) scale(1.2); }
        }

        /* ── modal bar ── */
        .modal-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 20, 0.92);
            backdrop-filter: blur(12px);
            padding: 14px 30px;
            border-bottom: 1px solid rgba(200, 200, 200, 0.15);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-shrink: 0;
        }
        .modal-back {
            font-size: 34px;
            font-weight: 300;
            color: #ccc;
            background: rgba(200, 200, 200, 0.08);
            border: 1px solid rgba(200, 200, 200, 0.2);
            border-radius: 60px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;

        //  BUILD CARDS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const grid = document.getElementById('artistGrid');
        artists.forEach(a => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = a.id;
            const img = document.createElement('img');
            img.src = a.image;
            img.alt = a.name;
            img.loading = 'lazy';
            const title = document.createElement('div');
            title.className = 'card-title';
            const span = document.createElement('span');
            span.textContent = a.name;
            span.dataset.text = a.name;
            title.appendChild(span);
            card.appendChild(img);
            card.appendChild(title);
            grid.appendChild(card);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  MOUSE GLOW & TILT ON CARDS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--mx', x + '%');
                card.style.setProperty('--my', y + '%');
                const rotX = (y - 50) / 8;
                const rotY = (x - 50) / 8;
                card.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.04)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(800px) rotateX(0) rotateY(0) scale(1)';
            });
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const modalBack = document.getElementById('modalBack');
        const modalTabTitle = document.getElementById('modalTabTitle');
        const modalCounter = document.getElementById('modalCounter');

        let currentAlbumIndex = null;
        let isPlaying = false;
        let followListener = null;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER FUNCTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function renderArtistView(artistId) {
            const artist = artists.find(a => a.id === artistId);
            if (!artist) return;
            currentArtistId = artistId;
            modalTabTitle.textContent = artist.name;
            modalCounter.textContent = artist.genre.split(',')[0].trim();
            modalCounter.classList.remove('is-playing');

            let historyHTML = artist.history.map(item => `<li>${item}</li>`).join('');
            let albumsHTML = '';
            if (artist.albums && artist.albums.length) {
                albumsHTML = artist.albums.map((alb, index) => `
                        <div class="album-item" data-artist="${artist.id}" data-album="${index}">
                            <div class="album-cover"><img src="${alb.cover}" alt="${alb.name}" loading="lazy"></div>
                            <div class="album-name">${alb.name}</div>
                            <div class="album-year">${alb.year}</div>
                        </div>
                    `).join('');
            } else {
                albumsHTML = '<p style="color:#888;">No albums listed</p>';
            }

            modalBody.innerHTML = `
                    <div class="artist-header" id="artistHeader">
                        <div class="artist-img" id="artistImg">
                            <img src="${artist.image}" alt="${artist.name}">
                        </div>
                        <div class="artist-info">
                            <h2 data-text="${artist.name}">${artist.name}</h2>
                            <div class="origin">${artist.origin}</div>
                            <div class="genre">${artist.genre}</div>
                        </div>
                    </div>
                    <div class="history">
                        <h3>History</h3>
                        <ul>${historyHTML}</ul>
                    </div>
                    <div class="albums">
                        <h3>Albums</h3>
                        <div class="album-grid">${albumsHTML}</div>
                    </div>
                `;

            const artistImg = document.getElementById('artistImg');
            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }
            if (artistImg) {
                followListener = (e) => {
                    const modalRect = modal.getBoundingClientRect();
                    let x = (e.clientX - modalRect.left) / modalRect.width;
                    let y = (e.clientY - modalRect.top) / modalRect.height;
                    x = Math.max(0, Math.min(1, x));
                    y = Math.max(0, Math.min(1, y));
                    const rotY = (x - 0.5) * 40;
                    const rotX = (0.5 - y) * 40;
                    artistImg.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
                };
                document.addEventListener('mousemove', followListener);
            }

            document.querySelectorAll('.album-item').forEach(el => {
                el.addEventListener('click', function() {
                    const aId = this.dataset.artist;
                    const albIdx = parseInt(this.dataset.album);
                    showAlbumSongs(aId, albIdx);
                });
            });
        }

        // ─────────────────────────────────────────────

        function showAlbumSongs(artistId, albumIndex) {
            const artist = artists.find(a => a.id === artistId);
            if (!artist) return;
            const album = artist.albums[albumIndex];
            if (!album) return;
            currentArtistId = artistId;
            currentAlbumIndex = albumIndex;

            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }

            modalTabTitle.textContent = `${artist.name} – ${album.name}`;
            modalCounter.textContent = (album.songs ? album.songs.length : 0) + ' tracks';
            modalCounter.classList.remove('is-playing');

            let songsHTML = '';
            if (album.songs && album.songs.length) {
                songsHTML = `<ul class="song-list">`;
                album.songs.forEach((song, idx) => {
                    const hasUrl = song.url && song.url.trim() !== '';
                    const playIcon = hasUrl ? '▶' : '⏸';
                    songsHTML += `
                            <li data-artist="${artistId}" data-album="${albumIndex}" data-song="${idx}">
                                <span class="play-icon">${playIcon}</span>
                                <span class="song-name">${song.name}</span>
                                <span class="song-length">${hasUrl ? 'audio' : 'no audio'}</span>
                            </li>
                        `;
                });
                songsHTML += `</ul>`;
            } else {
                songsHTML = `<p class="no-songs">No songs listed for this album.</p>`;
            }

            modalBody.innerHTML = `
                    <div class="song-list-view">
                        <div class="back-to-artist" id="backToArtist">← Back to ${artist.name}</div>
                        <h2>${album.name}</h2>
                        <div class="album-year">${album.year}</div>
                        ${songsHTML}
                    </div>
                `;

            document.getElementById('backToArtist').addEventListener('click', () => {
                renderArtistView(artistId);
            });

            document.querySelectorAll('.song-list li').forEach(item => {
                item.addEventListener('click', function() {
                    const aId = this.dataset.artist;
                    const albIdx = parseInt(this.dataset.album);
                    const songIdx = parseInt(this.dataset.song);
                    showPlayer(aId, albIdx, songIdx);
                });
            });
        }

        // ─────────────────────────────────────────────

        function showPlayer(artistId, albumIndex, songIndex) {
            const artist = artists.find(a => a.id === artistId);
            if (!artist) return;
            const album = artist.albums[albumIndex];
            if (!album) return;
            const song = album.songs[songIndex];
            if (!song || !song.url || song.url.trim() === '') {
                alert('No audio URL for this track.');
                return;
            }

            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }

            modalTabTitle.textContent = `${artist.name} – ${song.name}`;
            modalCounter.textContent = 'playing';
            modalCounter.classList.add('is-playing');

            modalBody.innerHTML = `
                    <div class="player-view">
                        <div class="back-to-songs" id="backToSongs">← Back to songs</div>
                        <div class="player-track-info">
                            <div class="track-name">${song.name}</div>
                            <div class="track-album">${album.name} • ${artist.name}</div>
                        </div>
                        <div class="player-controls">
                            <div class="play-pause-btn" id="playPauseBtn">⛥</div>
                            <span class="time-display" id="currentTimeDisplay">0:00</span>
                            <div class="progress-container" id="progressContainer">
                                <div class="progress-bar" id="progressBar"></div>
                            </div>
                            <span class="time-display" id="durationDisplay">0:00</span>
                        </div>
                    </div>
                `;

            audio.src = song.url;

            audio.play().then(() => {
                isPlaying = true;
            }).catch(err => {
                console.warn('Playback failed:', err);
                isPlaying = false;
            });

            const playPauseBtn = document.getElementById('playPauseBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const currentTimeDisplay = document.getElementById('currentTimeDisplay');
            const durationDisplay = document.getElementById('durationDisplay');

            function updateProgress() {
                if (!audio.duration || isNaN(audio.duration)) {
                    durationDisplay.textContent = '0:00';
                } else {
                    durationDisplay.textContent = formatTime(audio.duration);
                }
                if (audio.currentTime) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressBar.style.width = percent + '%';
                    currentTimeDisplay.textContent = formatTime(audio.currentTime);
                }
            }

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateProgress);

            playPauseBtn.addEventListener('click', () => {
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                } else {
                    audio.play().catch(e => console.warn(e));
                    isPlaying = true;
                }
            });

            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = rect.width;
                const percent = clickX / width;
                if (audio.duration) {
                    audio.currentTime = percent * audio.duration;
                }
            });

            document.getElementById('backToSongs').addEventListener('click', () => {
                audio.pause();
                audio.removeEventListener('timeupdate', updateProgress);
                audio.removeEventListener('loadedmetadata', updateProgress);
                isPlaying = false;
                showAlbumSongs(artistId, albumIndex);
            });

            audio.addEventListener('ended', () => {
                isPlaying = false;
                progressBar.style.width = '0%';
                currentTimeDisplay.textContent = '0:00';
            });
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  OPEN / CLOSE MODAL
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function openModal(artistId) {
            renderArtistView(artistId);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            audio.pause();
            audio.src = '';
            isPlaying = false;
            modalCounter.classList.remove('is-playing');
            if (followListener) {
                document.removeEventListener('mousemove', followListener);
                followListener = null;
            }
        }

        cards.forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.id;
                if (id) openModal(id);
            });
        });

        modalBack.addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        console.log('🔥 Artist names now glow in sleek gray/silver – all other effects remain!');
    </script>
</body>
</html>
